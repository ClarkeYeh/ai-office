name: CI
on:
  pull_request:
    branches: ['integration/**', main]
  push:
    branches: ['integration/**', main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check source
        run: pnpm typecheck
      - name: Type-check tests
        run: pnpm typecheck:tests
      - name: Build packages
        run: pnpm -r build
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Check dependency boundaries
        run: pnpm depcruise
      - name: Test dependency boundary rules
        run: pnpm depcruise:selftest
      - name: Check generated contracts
        run: pnpm contracts:check
      - name: Check browser bundle
        run: pnpm check:bundle
      - name: Scan fixtures for leaks
        run: pnpm fixtures:scan
